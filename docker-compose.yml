version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: retech-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: retech
    volumes:
      - mongo-data:/data/db
    networks:
      - retech-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retech-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/retech
      CORS_ORIGIN: "http://localhost,http://localhost:5173,http://localhost:80"
      JWT_SECRET: "retech_jwt_production_secret_change_in_real_env_2026_xyz"
      JWT_EXPIRES_IN: "7d"
      ADMIN_EMAIL: "admin@retech.in"
      ADMIN_PASSWORD: "Admin@ReTech2026!"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - retech-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retech-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - retech-network

volumes:
  mongo-data:
    driver: local

networks:
  retech-network:
    driver: bridge
