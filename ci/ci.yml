name: ReTech Platform CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile=false

      - name: Run Backend Typecheck
        working-directory: ./backend
        run: pnpm exec tsc --noEmit

      - name: Build Backend
        working-directory: ./backend
        run: pnpm build

  frontend-checks:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile=false

      - name: Run Frontend Typecheck
        working-directory: ./frontend
        run: pnpm exec tsc --noEmit

      - name: Build Frontend Application
        working-directory: ./frontend
        run: pnpm build

  python-agent-tests:
    name: Python Sanitization Agent Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent Dependencies
        working-directory: ./sanitization-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Python Agent Pytest Suite
        working-directory: ./sanitization-agent
        run: python -m pytest -v tests/test_agent.py

